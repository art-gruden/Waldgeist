# All bot texts. Edit freely — no programmer needed. Restart the bot after changes.
# Formatting: Telegram HTML (<b>, <i>). Words in {braces} are filled in by the bot — keep them.
# A list means "pick one variant at random".
# Rule of the game: texts never reproach and never mention how many days someone was away.

