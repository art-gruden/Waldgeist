help:
  text: |
    🌲 <b>Як живе чарівний ліс</b>

    ☀️ <b>Ранок.</b> Щодня з {window_start} до {window_end} привітайся в групі — кнопкою на листівці або словами («доброго ранку», «доброе утро», «good morning»). +{morning} ⚡ раз на день.
    🎓 <b>Заняття.</b> Ведуча називає кодове слово — надішли його мені (/code слово). Наживо +{live} ⚡, із запису +{recording} ⚡ протягом {days} днів.
    🏡 <b>Гості.</b> Раз на день можна піти в гості: господар отримує +{host} ⚡, гість +{guest} ⚡. Хто сам у гостях — того вдома немає 😉
    🌙 <b>Сон.</b> Якщо тебе довго немає, компаньйон засинає, але нічого не втрачає.

    /pet — компаньйон · /code — заняття · /visit — у гості · /world — ліс · /stats — статистика · /settings — нагадування

admin:
