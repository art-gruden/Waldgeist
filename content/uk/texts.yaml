  coming_soon: "Ця частина лісу ще росте 🌱 Скоро тут з'являться SPA, подорожі та спільні квести."

start:
  in_group: "Щоб завести компаньйона, напиши мені в особисті 🌿"
  welcome_back:
    - "З поверненням! {name} радіє тобі 💛"
    - "{name} вже чекає на тебе 🌿"
  not_member: "Чарівний ліс відкритий лише для учасників нашої групи 🌿 Якщо ти в групі, напиши адміністраторам."
  intro: |
    Вітаю, {first_name}! 🌲

    Я — Дух Лісу. У нашому чарівному лісі кожен має свого компаньйона: він росте, коли ти вітаєшся зранку, приходиш на заняття і заглядаєш у гості до друзів.

    Тут ніхто не хворіє і нічого не втрачає. Якщо тебе довго не буде — твій компаньйон просто солодко засне і дуже зрадіє, коли ти повернешся.

