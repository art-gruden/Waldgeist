    text: |
      Я дозволяю близьким і друзям проживати їхнє власне життя — і я відпускаю їх.
      Я дозволяю їм проходити свої життєві уроки і самостійно вирішувати проблеми.
      Я легко кажу «ні».
      Я усвідомлюю: мої близькі прийшли сюди, щоб прожити своє життя і навчитися справлятися з труднощами. Це їх зміцнює і розвиває.

  - id: aff-034
    theme: кордони
    source: "Урок «Субособистості: добра і зла мама, добрий і злий тато», 13.02.2026"
    text: |
      Я із задоволенням займаюся своїми справами і задовольняю власні потреби.
      Мої потреби так само важливі, як і потреби інших людей.
      Я прислухаюся до потреб свого тіла і даю йому те, що необхідно.
      Я люблю життя.
      Я дозволяю близьким, рідним і друзям піклуватися про мене.

  # --- Рід ------------------------------------------------------------
  - id: aff-035
    theme: рід
    source: "Урок «Родова система: початок теми роду», 10.04.2026"
    text: |
      Я дякую своєму роду і батькам за те, що вони дали мені життя.
      Я дякую батькам за їхню роботу, ласку, увагу, виховання, терпіння і прощення.
      Я дякую своєму роду за те, що дав мені місце і можливість у ньому втілитись.
      Для мого життя у мене є все, і цього достатньо.
      Все інше я створю з підтримкою Творця.

  - id: aff-036
    theme: рід
    source: "Урок «Родова система: початок теми роду», 10.04.2026"
    text: |
      Рід мій могутній.
      Я відміняю програми злиднів і бідності, накопичені в моєму роду, і виражаю намір про їхню трансформацію в енергію достатку і процвітання мого роду.
      Я наповнюю через свої думки і вчинки свій рід енергією любові і творіння.

  # --- Довіра / ранок -------------------------------------------------
  - id: aff-037
    theme: ранок
    source: "Практика ранкового налаштування, Telegram, 07.04.2025"
    text: |
      Після пробудження усміхніться і скажіть вголос або подумки:

      «Цей день несе мені радість, удачу і благополуччя. Усе складається якнайкраще!»

      Потягніться, зробіть кілька глибоких вдихів і налаштуйтеся на прийняття нового у своє життя 💞

  - id: aff-038
    theme: довіра
    source: "Telegram, 24.03.2026"
    text: |
      Не поспішайте. Не намагайтеся відповідати очікуванням. Просто будьте — справжніми, глибокими, щирими.

      Скажіть собі зранку:
      🪻 Я в потоці життя.
      🪻 Я довіряю шляху.
      🪻 Я дозволяю собі бути щасливою (щасливим) і спокійною (спокійним).

  - id: aff-039
    theme: довіра
    source: "Урок «Закони Всесвіту: рада мудреців і наставники», 03.04.2026"
    text: |
      Я дякую всім своїм кураторам і наставникам, а також усій родині світла за те, що вони завжди поруч.
      Дякую, дякую, дякую.
      Нехай відбудеться диво на благо.

  - id: aff-040
    theme: довіра
    source: "Урок «Закони Всесвіту: продовження, вік душі», 20.03.2026; урок 03.04.2026"
    text: |
      Я віддаю Творцю на розгляд усі свої справи і питання.
      Нехай буде воля Твоя, а не моя.
      Нехай буде на вище благо.

  # --- Еволюція / відпускання ----------------------------------------
  - id: aff-041
    theme: еволюція
    source: "Урок «Его: хочу та потреба душі», 16.01.2026"
    text: |
      Тут і зараз я зберігаю і укріплюю свій зв'язок із Творцем.
      Я вибираю свою еволюцію в даному втіленні — на хвилі безумовної любові і всеприйняття.

  - id: aff-042
    theme: відпускання
    source: "Урок «Субособистості: правота і неправота», 27.02.2026"
    text: |
      Я це приймаю і відпускаю.
      Я відпускаю програму, де я доводжу іншим, що вони неправі.
      Я дозволяю собі бути правою (правим) — і дозволяю іншим бути собою.

  - id: aff-043
    theme: відпускання
    source: "Урок «Карма: кармічні уроки і борги», 13.03.2026"
    text: |
      Так, ця подія мені не подобається, але вона є.
      Я це приймаю з миром — і дивлюся, чого вона мене вчить.

  - id: aff-044
    theme: подяка
    source: "Урок «Карма: кармічні уроки і борги», 13.03.2026"
    text: |
      Я це дарую — це мій дар від усієї душі, від мого щирого серця.
      Мені не потрібно, щоб це повертали.
      Це мій вклад на благо світу.

  - id: aff-045
    theme: молитва
    source: "Намір на проходження Каяття, Telegram, 23.09.2025"
    text: |
      Дорогий Творець Небесний, Отче, що дав мені життя! Я дякую Тобі за все, що є в ньому.
      Я дякую Тобі за дар життя, за випробування і уроки.
      Обіцяю вчитися, змінюватися, чинити добро і світити любов'ю.
      Нехай мої вчинки відтепер приносять світло.
      Наповни мене силою, миром і любов'ю.
      Хай буде так.

# ---------------------------------------------------------------------
#  ДУХОВНІ ЗАКОНИ
# ---------------------------------------------------------------------
laws:

  # --- Урок 13.03.2026 «Карма: кармічні уроки і борги» ---------------
  - id: law-001
    name: "Закон причинно-наслідкового зв'язку"
    source: "Урок «Карма: кармічні уроки і борги», 13.03.2026"
    essence: >-
      Що посіяно думками, словами, діями й станами, те згодом пожинається
      як подія або життєвий результат. Це основний закон проживання душі на планеті.
    practice: "Свідомо сійте те, що хочете побачити в майбутньому: мир, повагу, доброзичливість, чесність."

  - id: law-002
    name: "Закон творіння"
    source: "Урок «Карма: кармічні уроки і борги», 13.03.2026"
    essence: >-
      Людина творить власне життя зсередини. Зовнішнє завжди відображає
      внутрішній світ.

  - id: law-003
    name: "Закон смирення"
    source: "Урок «Карма: кармічні уроки і борги», 13.03.2026"
    essence: >-
      Щоб змінити ситуацію, спочатку її треба побачити й прийняти — без
      внутрішньої війни. Поки подію заперечують, вона повторюється.
    quote: "Так, воно мені не подобається, але ж воно є. І тому я це приймаю з миром."
    practice: "Не заперечуйте складну подію: визнайте її і запитайте себе, чому вона прийшла саме зараз."

  - id: law-004
    name: "Закон зростання"
    source: "Урок «Карма: кармічні уроки і борги», 13.03.2026; урок 20.03.2026"
    essence: >-
      Справжні зміни починаються з власного розвитку, а не зі спроб змінити
      інших. Через внутрішні зміни змінюється й зовнішня ситуація.
    quote: "Хочете змін? Змінюйтеся. Але не змінюйте людей."
    practice: "Зосередьтеся на власній еволюції і на тому, щоб змінити свою звичну реакцію."

  - id: law-005
    name: "Закон відповідальності"
    source: "Урок «Карма», 13.03.2026; урок «Кармічні закони, ч. 3», 27.03.2026"
    essence: >-
      Людина відповідає за власні реакції, вибори і за все, що віддзеркалює
      її життя.
    quote: "Абсолютно все, що в нашому житті відбувається — і добре, і неприємне, і радісне, і щасливе, — це все є наша відповідальність."

  - id: law-006
    name: "Закон зв'язку"
    source: "Урок «Карма: кармічні уроки і борги», 13.03.2026"
    essence: >-
      Усі події пов'язані між собою: минуле, теперішнє і майбутнє
      з'єднуються через наші кроки.

  - id: law-007
    name: "Закон фокусу уваги"
    source: "Урок «Карма: кармічні уроки і борги», 13.03.2026"
    essence: >-
      Енергія працює там, де є уважна концентрація. Розсіяна увага
      послаблює результат.
    practice: "Коли ситуація не вирішується, потрібні не хаотичні зусилля, а сфокусована увага і накопичення внутрішнього ресурсу."

  - id: law-008
    name: "Закон дарування"
    source: "Урок «Карма: кармічні уроки і борги», 13.03.2026"
    essence: >-
      Щире віддавання без очікування повернення вирівнює дисбаланс і
      запускає зміни.
    quote: "Я це дарую, це мій дар від усієї душі, від мого щирого серця."
    practice: "Даруйте увагу, допомогу, підтримку, речі або час — без позиції «я тобі, а ти мені»."

  - id: law-009
    name: "Закон «тут і зараз»"
    source: "Урок «Карма: кармічні уроки і борги», 13.03.2026"
    essence: >-
      Реальне життя відбувається в теперішньому моменті — саме тут
      створюється майбутнє.
    practice: "Забирайте свою енергію з неактуальних планів, старих мрій і сценаріїв, які вже втратили сенс."

  - id: law-010
    name: "Закон змін"
    source: "Урок «Карма: кармічні уроки і борги», 13.03.2026"
    essence: >-
      Опір змінам створює застій, страх і виснаження. Рух і гнучкість
      відкривають новий сценарій.

  - id: law-011
    name: "Закон терпіння і винагороди"
    source: "Урок «Карма: кармічні уроки і борги», 13.03.2026"
    essence: >-
      Не все дозріває миттєво — спокійне очікування є частиною процесу.
    practice: "Після внутрішньої роботи не форсуйте результат, а дайте процесу дозріти."

  - id: law-012
    name: "Закон значення і натхнення"
    source: "Урок «Карма: кармічні уроки і борги», 13.03.2026"
    essence: >-
      Коли людина проходить свій урок і отримує його плід, це відкриває
      новий ресурс, радість і творчість.

  - id: law-013
    name: "Закон свободи волі та права вибору"
    source: "Урок «Карма», 13.03.2026; урок «Кармічні закони, ч. 3», 27.03.2026"
    essence: >-
      Кожна людина обирає сама: приймати урок чи ігнорувати його, діяти чи
      чекати, змінюватися чи ні. Творець найвідповідальніше ставиться саме до
      цього закону і не втручається у вибір людини — тому відповідальність за
      вибір лише наша.

  - id: law-014
    name: "Закон рівноваги"
    source: "Урок «Карма: кармічні уроки і борги», 13.03.2026"
    essence: >-
      Усі закони важливо проживати не в крайнощах, а в балансі, довіряючи
      загальному порядку.

  - id: law-015
    name: "Закон здійснення"
    source: "Урок «Карма: кармічні уроки і борги», 13.03.2026"
    essence: >-
      Думки та образи прагнуть до матеріалізації. Страх і недовіра
      спотворюють бажаний результат.

  - id: law-016
    name: "Закон співзвучності («Що вгорі, те і внизу»)"
    source: "Урок «Карма», 13.03.2026; урок 03.04.2026"
    essence: >-
      Те, що формується у внутрішньому та тонкому плані, згодом
      проявляється в матеріальному житті.

  - id: law-017
    name: "Закон подібності"
    source: "Урок «Карма», 13.03.2026; повідомлення Омнії в Telegram, 31.10.2025"
    essence: >-
      Подібне притягує подібне: ми зустрічаємо тих, з ким резонуємо за станом
      і рівнем свідомості. Такі ситуації — не покарання, а урок: вони
      показують, де ми зараз знаходимося вібраційно.
    quote: "Внутрішня боротьба, невдоволення або неприйняття притягують до нас людей і події, які відображають ті ж самі стани."
    practice: "Твій внутрішній стан формує події навколо тебе — піднімай свої вібрації."

  - id: law-018
    name: "Закон дуальності"
    source: "Урок «Карма: кармічні уроки і борги», 13.03.2026"
    essence: >-
      У світі є полярності, і тиск часто породжує опір рівної сили.

  - id: law-019
    name: "Закон маятника (ритму)"
    source: "Урок «Карма: кармічні уроки і борги», 13.03.2026"
    essence: >-
      Після піку завжди йде рух у протилежний бік. Утримати все незмінним
      неможливо.

  # --- Урок 20.03.2026 «Закони Всесвіту: продовження, вік душі» -------
  - id: law-020
    name: "Закон порожнечі"
    source: "Урок «Закони Всесвіту: продовження, вік душі», 20.03.2026"
    essence: >-
      Будь-яка порожнеча прагне бути заповненою: коли щось іде з життя, на
      його місце приходить нове. Але лише тоді, коли простір справді
      звільнений — думками, образами, болем.
    practice: "Щоб нове прийшло, подякуйте минулому за досвід і перестаньте тримати на ньому увагу."

  - id: law-021
    name: "Закон шлагбаума"
    source: "Урок «Закони Всесвіту: продовження, вік душі», 20.03.2026"
    essence: >-
      Усі можливості даються заздалегідь, але для їхньої реалізації треба
      зробити крок назустріч. Перша перешкода — не знак «стоп», а перевірка
      рішучості.
    practice: "Подолайте сумніви, страх та інерцію — і шлагбаум відкриється. На справжнє бажання даються ресурси й сили."

  - id: law-022
    name: "Закон нейтрального положення"
    source: "Урок «Закони Всесвіту: продовження, вік душі», 20.03.2026"
    essence: >-
      Якщо обраний шлях виявився не вашим, не застрягайте в жалю чи
      самозвинуваченні. Визнайте досвід, подякуйте йому і спокійно змініть
      напрямок. Нейтральність — не байдужість, а внутрішня рівновага.

  - id: law-023
    name: "Закон плати та енергообміну"
    source: "Урок 20.03.2026; урок «Прощення роду», 31.07.2026"
    essence: >-
      У світі має зберігатися баланс. Хто недодає, не дякує, хоче все
      «безкоштовно» — створює енергетичний борг. Хто дає щиро, з вдячністю і
      трохи більше — формує позитивний депозит. Так само важливо вміти приймати
      подяку.
    quote: "Там, де ви щось не додали, десь у вас щось забереться."

  - id: law-024
    name: "Закон еволюції"
    source: "Урок «Закони Всесвіту: продовження, вік душі», 20.03.2026"
    essence: >-
      Усе у Всесвіті розвивається — і застій суперечить природі життя. Коли
      людина росте, навчається, відкриває нове, душа підтримує її значно
      сильніше.
    practice: "Щоденний розвиток — необхідна умова гармонійного життя."

  - id: law-025
    name: "Закон вібрації"
    source: "Урок «Закони Всесвіту: продовження, вік душі», 20.03.2026"
    essence: >-
      Усе у світі має свою вібрацію. Душа пізнається через тепло, м'якість,
      радість і ясність. Образа, страх, жадібність, осуд знижують вібрацію і
      віддаляють від гармонії.

  - id: law-026
    name: "Закон компенсації (закон коромисла)"
    source: "Урок «Закони Всесвіту: продовження, вік душі», 20.03.2026"
    essence: >-
      Усе прагне до балансу: якщо одна чаша переобтяжена, інша врівноважує
      систему. Баланс — не нерухомість, а здатність жити в гармонійному ритмі
      без крайнощів.

  - id: law-027
    name: "Закон прохання"
    source: "Урок «Закони Всесвіту: продовження, вік душі», 20.03.2026"
    essence: >-
      Щоб отримати допомогу, треба вміти просити — усвідомлено, з довірою і
      готовністю прийняти будь-яку відповідь, а не з вимогою чи капризом.
    quote: "Нехай буде на вище благо."
    practice: "Додавайте до кожного прохання «Нехай буде на вище благо» — так легше приймати і дане, і недане."

  - id: law-028
    name: "Закон багаторазового повернення"
    source: "Урок «Закони Всесвіту: продовження, вік душі», 20.03.2026"
    essence: >-
      Коли ділишся щиро, без вигоди й від серця, добро повертається
      примноженим. Найвищий рівень закону — бажати добра навіть тим, хто був
      для тебе болісним досвідом.

  - id: law-029
    name: "Закон таксі"
    source: "Урок «Закони Всесвіту: продовження, вік душі», 20.03.2026"
    essence: >-
      Всесвіт — це таксі, а ми пасажири. Таксі приїде, лише якщо його
      викликати: чітко знати мету і виразити намір. Далі — сісти, довіритися
      водієві-Всесвіту і не смикати: «не туди їдете, швидше, повертайте».
      А після приїзду — обов'язково оплатити поїздку подякою.

  - id: law-030
    name: "Закон доповнення"
    source: "Урок «Закони Всесвіту: продовження, вік душі», 20.03.2026"
    essence: >-
      Якщо ваша мета не суперечить законам Всесвіту і корисна не лише вам,
      Творець підтримує на шляху — через людей, знання, інформацію, події.
      Тоді мета досягається значно швидше.

  - id: law-031
    name: "Закон ланцюгової реакції"
    source: "Урок «Закони Всесвіту: продовження, вік душі», 20.03.2026"
    essence: >-
      Коли Творець вибудовує ланцюжок подій — ви «потрапили в струмінь».
      Тоді треба діяти й використовувати всі шанси, бо енергії змінюються, і
      за кілька днів умови можуть бути вже іншими.

  # --- Урок 27.03.2026 «Кармічні закони, ч. 3» ------------------------
  - id: law-032
    name: "Закон аналогії"
    source: "Урок «Кармічні закони, ч. 3», 27.03.2026"
    essence: >-
      Цей закон дозволяє досягнути розуміння божественної сили й істини —
      всередині себе і у Всесвіті.
    quote: "Пізнай самого себе — і ти пізнаєш увесь світ."

  - id: law-033
    name: "Закон дозрівання"
    source: "Урок «Кармічні закони, ч. 3», 27.03.2026"
    essence: >-
      Кожна подія має свій термін дозрівання, як плід чи дитина. Якщо сьогодні
      запущено процес і виражено намір, результат не з'явиться завтра. Швидкість
      залежить від вібрацій, підготовки і від того, наскільки людина справді
      працює над собою.
    practice: "Заявили намір — відпустіть. Пришвидшувати — все одно що зривати зелені плоди."

  - id: law-034
    name: "Закон прикладу"
    source: "Урок «Кармічні закони, ч. 3», 27.03.2026"
    essence: >-
      Наша сила найпотужніше проявляється тоді, коли ми своїм прикладом
      надихаємо інших. Не нав'язуйте близьким свій шлях — найкраще, що ви можете
      зробити, це бути прикладом: коли вони побачать, як ви змінилися, вони самі
      запитають.

  - id: law-035
    name: "Закон прийняття і спокою"
    source: "Урок «Кармічні закони, ч. 3», 27.03.2026"
    essence: >-
      Неважливо, в якому стані люди навколо — ви можете не піддаватися впливу
      їхнього стану. Людина в агресії створює свій світ, а ви в прийнятті й
      спокої — свій гармонійний, дуже красивий особистий всесвіт.

  - id: law-036
    name: "Закон особистої вартості"
    source: "Урок «Кармічні закони, ч. 3», 27.03.2026"
    essence: >-
      Коли ви в спокої, а людина поряд — у розбалансованому стані, вона може
      намагатися знецінити вас, щоб виправдати себе. Ваша вартість не залежить
      від чужої оцінки.

  - id: law-037
    name: "Закон сенсу життя"
    source: "Урок «Кармічні закони, ч. 3», 27.03.2026"
    essence: >-
      Кожна людина бачить сенс у чомусь своєму, і сенси бувають протилежними.
      У вас є право вибору — яким сенсом жити і чого досягати.

  - id: law-038
    name: "Закон полярності"
    source: "Урок «Кармічні закони, ч. 3», 27.03.2026"
    essence: >-
      Існують протилежності: одна людина живе однією полярністю, інша — іншою.
      Коли ви усвідомлені й у спокої, ви зможете зрозуміти людину; а та, що
      вібрує низько, може вас не зрозуміти — і це її вибір.

  - id: law-039
    name: "Закон «Зі своїм статутом у чужий монастир не ходять»"
    source: "Урок «Кармічні закони, ч. 3», 27.03.2026"
    essence: >-
      Свою думку можна висловити, але не нав'язувати. Навіть якщо ви відчуваєте,
      що ваша думка істинна, а людина її ігнорує — дозвольте їй бути на своїй
      території, у своєму «монастирі». Це її право вибору.

  - id: law-040
    name: "Закон «Дій інакше»"
    source: "Урок «Кармічні закони, ч. 3», 27.03.2026"
    essence: >-
      Нічого не існує окремо і незалежно — ми всі частинки єдиного цілого.
      Коли ми вислуховуємо різні думки, то стаємо багатогранними і знаходимо
      третє, кращe рішення: не так, як я, і не так, як ти, а щось ефективніше
      між ними.

  - id: law-041
    name: "Закон вдячності"
    source: "Урок «Кармічні закони, ч. 3», 27.03.2026"
    essence: >-
      Коли маніфестація здійснилася, обов'язково дякуємо Всесвіту і людям, які
      колись наштовхнули на цю думку, — вони стали провідниками вашого бажання.
      Тоді сама божественна природа допомагає досягати бажаного найменшими
      зусиллями.

  - id: law-042
    name: "Закон пошани"
    source: "Урок «Кармічні закони, ч. 3», 27.03.2026"
    essence: >-
      Цінуйте думку іншої людини, навіть якщо не використовуєте її. Хто не
      дякує і не зважає на інших, живе без закону пошани — і згодом зустрічає
      протистояння й конфлікти. Не треба боротися із Всесвітом через інших людей.

  - id: law-043
    name: "Закон неприв'язаності"
    source: "Урок «Кармічні закони, ч. 3», 27.03.2026"
    essence: >-
      Якщо постійно думати про бажане і тримати його перед собою, воно не може
      дозріти. Прив'язаність буває не лише до людей — і до грошей, і навіть до
      саморозвитку.
    practice: "Чітко заявіть свій маніфест — і відпустіть."

  - id: law-044
    name: "Закон відносності"
    source: "Урок «Кармічні закони, ч. 3», 27.03.2026"
    essence: >-
      Немає ні добра, ні зла, ні великого, ні малого — це лише наші порівняння.
      Усе, що ми називаємо неприємністю, дане нам для розвитку. Зрозумій, для
      чого, — і ситуація вирішується.
    quote: "Це не горе, це просто ситуація, яку можна вирішити."

  - id: law-045
    name: "Закон синхронності та благодаті"
    source: "Урок «Кармічні закони, ч. 3», 27.03.2026"
    essence: >-
      Коли ми живемо в синхронності зі Всесвітом і в довірі, ми отримуємо стан
      благодаті — і завжди опиняємося в правильному місці у правильний час.

  # --- Урок 03.04.2026 «Закони Всесвіту: рада мудреців і наставники» -
  - id: law-046
    name: "Закон «Як аукнеться, так і відгукнеться»"
    source: "Урок «Закони Всесвіту: рада мудреців і наставники», 03.04.2026"
    essence: >-
      Що ти зробив і що ти випромінюєш — те й отримуєш. Зараз зворотний зв'язок
      від Всесвіту приходить майже миттєво — в межах цього життя.
    quote: "Не буде ніхто, окрім тебе, прибирати те, що ти наслідив."

  - id: law-047
    name: "Закон фрактальності"
    source: "Урок «Закони Всесвіту: рада мудреців і наставники», 03.04.2026"
    essence: >-
      Кожна клітинка тіла несе повну інформацію про весь організм. Так і наша
      душа знає все, бо вона — частина Бога.

  - id: law-048
    name: "Закон відповіді на зло"
    name_note: "назва умовна — Омнія описала закон без назви"
    source: "Урок «Закони Всесвіту: рада мудреців і наставники», 03.04.2026"
    essence: >-
      Коли скривджений відповідає кривднику прокляттями й негативом, він
      розділяє його участь — навіть якщо вважав себе світлою людиною — і бере на
      себе частину його карми.

  - id: law-049
    name: "Закон божественної справедливості"
    source: "Урок «Закони Всесвіту, карма людства, Хроніки Акаші», 20.06.2025"
    essence: >-
      На планеті запущені закони божественної істини і справедливості. Душу
      зберігає той, хто пізнає закони і живе ними, відпрацьовує кармічні борги
      і не порушує закони справедливості.
