# =====================================================================
#  Щоденні пости для групи «Шлях до істини»
#  Афірмації та духовні закони з уроків і повідомлень Омнії
# =====================================================================
#
#  Як використовувати в боті:
#    - раз на день бот бере ОДИН випадковий запис із affirmations або laws;
#    - рекомендовано чергувати типи (день — афірмація, день — закон)
#      і не повторювати запис, доки не використано всі (див. schedule);
#    - пост формується за шаблоном із розділу templates (parse_mode: HTML);
#    - поля quote, practice, closing — необов'язкові: якщо поля немає,
#      відповідний блок у пості просто пропускається.
#
#  Джерела: транскрипції уроків 2025–2026, конспекти лекцій,
#  повідомлення Омнії в Telegram-чаті. Тексти афірмацій — дослівно
#  з мінімальною граматичною правкою (відмінки, рід); закони — стисло
#  переказані словами уроку, цитати в полі quote — слова Омнії.
# =====================================================================

meta:
  title: "Афірмації та духовні закони від Омнії"
  group: "Шлях до істини"
  language: uk
  version: 1
  compiled: 2026-11-07

schedule:
  posts_per_day: 1
  mode: random            # випадковий вибір
  alternate_types: true   # чергувати affirmation / law
  no_repeat_until_exhausted: true

templates:
  affirmation: |
    🌟 <b>Афірмація дня</b>

    {text}
    {closing}
    <i>Говоріть не головою — серцем. Відчуйте, як відгукується всередині.</i>
  law: |
    📜 <b>Закон дня: {name}</b>

    {essence}
    {quote_block}{practice_block}
  quote_block: "\n💬 <i>«{quote}»</i>\n"
  practice_block: "\n✨ <b>У житті:</b> {practice}\n"

# ---------------------------------------------------------------------
#  АФІРМАЦІЇ
#  theme: подяка | я-є | днк | любов-до-себе | рід | кордони |
#         довіра | еволюція | відпускання | молитва | ранок | здоров'я
# ---------------------------------------------------------------------
