name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ec
          POSTGRES_PASSWORD: ec
          POSTGRES_DB: enchanted_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ec" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://ec:ec@localhost:5432/enchanted_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -q
      - name: Migrations apply cleanly
        env:
          DATABASE_URL: postgresql+asyncpg://ec:ec@localhost:5432/enchanted_test
        run: alembic upgrade head && alembic check
      - run: docker build -t enchanted-companions:ci .
