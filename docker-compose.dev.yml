# Local development database on your Mac:  docker compose -f docker-compose.dev.yml up -d
# Then in .env:  DATABASE_URL=postgresql+asyncpg://ec:devpassword@localhost:5432/enchanted
name: enchanted-companions-dev
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: enchanted
      POSTGRES_USER: ec
      POSTGRES_PASSWORD: devpassword
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - devdata:/var/lib/postgresql/data
volumes:
  devdata: {}
